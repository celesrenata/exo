[project]
name = "exo"
version = "0.3.0"
description = "Exo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.12.14",
    "types-aiofiles>=24.1.0.20250708",
    "pydantic>=2.11.7",
    "fastapi>=0.116.1",
    "filelock>=3.18.0",
    "rustworkx>=0.17.1",
    "huggingface-hub>=0.33.4",
    "psutil>=7.0.0",
    "loguru>=0.7.3",
    "exo_pyo3_bindings", # rust bindings
    "anyio==4.11.0",
    "mlx==0.30.5; sys_platform == 'darwin'",
    "mlx-lm==0.30.6; sys_platform == 'darwin'",
    "tiktoken>=0.12.0", # required for kimi k2 tokenizer
    "hypercorn>=0.18.0",
    "openai-harmony>=0.0.8",
    "httpx>=0.28.1",
    "tomlkit>=0.13.0",
    "pillow>=10.4.0,<11.0", # compatibility with mflux 0.15.5
    "mflux==0.15.5",
    "python-multipart>=0.0.21",
    "tinygrad>=0.9.0",
    "safetensors>=0.4.0",
    "transformers>=5.7.0",
    "torch>=2.11.0; sys_platform == 'linux'",
    "triton-xpu>=3.7.0; sys_platform == 'linux'",
]

[project.scripts]
exo = "exo.main:main"

# dependencies only required for development
[dependency-groups]
dev = [
    "basedpyright>=1.29.0",
    "hypothesis>=6.131.0",
    "pyinstaller>=6.17.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-env",
    "ruff>=0.11.13",
]

# mlx[cuda] requires a newer version of mlx. the ideal on linux is: default to mlx[cpu] unless[cuda] specified.
[project.optional-dependencies]
mlx-cpu = [
    "mlx[cpu]==0.30.5",
]
tinygrad-opencl = [
    "pyopencl>=2024.1",
]
# PyTorch and IPEX are provided by Nix packages from MordragT's nixos repo
# pytorch-ipex = [
#     "torch>=2.0.0; sys_platform == 'linux'",
#     "intel-extension-for-pytorch>=2.0.0; sys_platform == 'linux'",
# ]
# cuda = [
#     "mlx[cuda]==0.26.3",
# ]

###
# workspace configuration
###

[tool.uv.workspace]
members = [
    "rust/exo_pyo3_bindings",
    "bench",
]

[tool.uv.sources]
exo_pyo3_bindings = { workspace = true }
torch = { index = "pytorch-xpu", marker = "sys_platform == 'linux'" }
triton-xpu = { index = "pytorch-xpu", marker = "sys_platform == 'linux'" }
#mlx-lm = { git = "https://github.com/davidmcc73/mlx-lm", branch = "stable" }
# Uncomment to use local mlx/mlx-lm development versions:
# mlx = { path = "/Users/Shared/mlx", editable=true }
# mlx-lm = { path = "/Users/Shared/mlx-lm", editable=true }

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

###
# type-checker configuration
###

[tool.basedpyright]
include = [".venv/lib/mlx", ".venv/lib/mlx_lm", "src", "bench"]
typeCheckingMode = "strict"
failOnWarnings = true

reportAny = "error"
reportUnknownVariableType = "error"
reportUnknownParameterType = "error"
reportMissingParameterType = "error"
reportMissingTypeStubs = "error"
reportInvalidCast = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryTypeIgnoreComment = "error"

pythonVersion = "3.12"
pythonPlatform = "Darwin"

exclude = ["**/.venv", "**/venv", "**/__pycache__", "**/exo_scripts", "**/.direnv", "**/rust", "**/.github"]
stubPath = ".mlx_typings"

[[tool.basedpyright.executionEnvironments]]
root = "src"

###
# uv configuration
###

# supported platforms for this project
[tool.uv]
required-version = ">=0.8.6"
prerelease = "allow"
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]

# PyTorch XPU index for Intel iGPU support (torch.xpu)
[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

###
# ruff configuration
###

[tool.ruff]
extend-exclude = ["shared/protobufs/**", "*mlx_typings/**", "rust/exo_pyo3_bindings/**"]

[tool.ruff.lint]
extend-select = ["I", "N", "B", "A", "PIE", "SIM"]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselected by default)",
    "e2e: marks end-to-end tests requiring the full gremlin cluster"
]
env = [
  "EXO_TESTS=1"
]
addopts = "-m 'not slow'"
filterwarnings = [
    "ignore:builtin type Swig:DeprecationWarning",
]
